# Job プラグイン グローバル設定
# 詳細は docs/spec/02-yaml-schema.md 「グローバル設定 (config.yml)」を参照。

specialty_mode:
  # 専業外アクションの倍率。0.0 のとき報酬支払いも行動ログ書き込みも行わない。
  reward_non_specialty: 0.0
  # 未選択プレイヤーのログイン直後に選択ダイアログを自動表示するか。
  # false のときはプレイヤーが自発的に /jobs select を実行するまで表示しない。
  show_select_dialog_on_join: true
  # 一覧ダイアログのボタン押下で即確定せず、まず JobConditionsDialog を挟むか。
  # false のときは従来通りボタン押下で即確定する。
  disclose_before_select: true
  # JobConditionsDialog / /jobs info で報酬額を出すか。
  # false のときは対象のみ列挙し、額は伏せる。rare の chance/reward はどちらでも出さない。
  disclose_reward_amount: true
  # 専業変更のクールダウン。上から評価し within にマッチした最初のポリシーが適用される。
  # within に複数キーを書いた場合はすべて満たしたときだけマッチする (AND)。
  #   event_hours:      [start, end] の時間帯。end は排他上限。[22, 6] のような日跨ぎも可。
  #   first_join_within: サーバー初参加からの経過時間の上限。新規プレイヤーの優遇に使う。
  #                      初参加時刻が取得できないプレイヤーはマッチしない (default 側に落ちる)。
  # 判定は毎回引き直すので、初参加からの経過が閾値を跨ぐと次回変更可能時刻も変わる。
  change_policy:
    # 新規プレイヤーを優遇する例。有効にするなら他のポリシーより上に置く。
    # - within:
    #     first_join_within: 72h
    #   cooldown: 1h
    - within:
        event_hours: [0, 24]
      cooldown: 1h
    - default:
      cooldown: 5d

reward:
  # 小数点以下の桁数 (0..6)。0 のとき整数のみに丸める。
  decimals: 0
  # 丸め方式。java.math.RoundingMode の名称をそのまま指定する。
  # HALF_UP / HALF_EVEN / HALF_DOWN / UP / DOWN / CEILING / FLOOR / UNNECESSARY のいずれか。
  rounding_mode: HALF_UP
  # 報酬パイプラインの非同期実行。docs/plan/async-reward-pipeline.md を参照。
  async:
    # 段階 4 (基礎報酬) から 11 (行動ログ) を専用ワーカースレッドで実行するか。
    # false のとき全段階を main thread で同期実行する (従来の挙動)。
    enabled: true
    # ワーカーへの境界キュー容量。溢れた分は WARNING を出して捨てる。
    # 1 件あたり 200 バイト前後なので、100000 件で 20MB 程度を上限として見込む。
    queue_capacity: 100000
    # キュー深度がこの割合を超えたら WARNING を出す (30 秒に 1 回へ絞る)。
    backlog_warn_ratio: [0.5, 0.8]
    # 段階 10 の Vault 送金を main thread へ投げ返して実行するか。
    # Economy プラグインがスレッドセーフでない場合は true にする。
    economy_on_main: false
    # economy_on_main が true のとき、1 tick に main thread で処理する送金の上限。
    main_work_per_tick: 200
    # 拡張 Modifier / Splitter chain 1 件の所要時間がこれを超えたら WARNING を出す (ミリ秒)。
    slow_extension_threshold_ms: 50
    # onDisable でワーカーの drain を待つ上限 (ミリ秒)。
    drain_timeout_ms: 5000

daily_cap:
  # 1 日あたりの報酬上限。scope は total (全ジョブ合算) または per_job。
  amount: 1000000
  reset_at: "00:00"
  scope: total

persistence:
  type: mysql
  host: localhost
  port: 3306
  database: jobs
  user: jobs
  password: ""
  pool_size: 8
  retention_days: 30

kvs:
  # memory または redis。redis は Phase 2 の予約。
  type: memory

anti_automation:
  # 各 check の「グローバルデフォルト」。per-job YAML の anti_automation で
  # 同じキーを明示すれば per-job 値が勝つ。省略なら下の default が全ジョブに効く。
  #
  # 有効化:   `zero` を書く / section を書く
  # 無効化:   `off` を書く / section で `enabled: false`
  # 未指定:  行を消す（そのキーだけデフォルトなしになり、per-job で opt-in された場合のみ動く）
  #
  # 従来 (Phase 7 まで) と同じ挙動にしたければ、このセクションを空にして per-job YAML のみで有効化する。

  # spawner_origin_kills: zero
  # unplanted_crop_harvest: zero
  # recently_placed_break:      # 破壊側 (作物以外) と設置側 (作物含む) の両方に効く
  #   window_sec: 3600
  # auto_fed_processing:
  #   operator_ttl_sec: 60
  # villager_repeat_trade:
  #   cooldown_sec: 60
  #   scope: recipe
  # breed_non_player_breeder: zero

  notify:
    # 0 判定が発火したときに、プレイヤーへ ActionBar で理由を表示する。
    # 各 reason ごとに個別に切れる (reason 名は AntiAutomationCheck の REASON 定数と対応)。
    # per-job override は無い (グローバル固定)。
    action_bar:
      spawner_origin_kill: true
      unplanted_crop_harvest: true
      recently_placed_break: true
      recently_placed_replace: true
      auto_fed_processing: true
      villager_repeat_trade: true
      breed_non_player_breeder: true
